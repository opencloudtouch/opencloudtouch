# ==============================================================================
# PR COMMENT RELAY
#
# Posts/updates the sticky PR comments (CI summary, commit-lint failure) that
# ci.yml's jobs stage as JSON artifacts instead of posting directly.
#
# Runs via `workflow_run`, triggered the moment `CI` completes, using this
# file (never the fork's copy). This workflow never checks out or runs any
# code from the PR; it only reads the small JSON payloads that ci.yml's own
# trusted jobs already staged as artifacts.
#
# The comment-posting step authenticates with `secrets.BOT_PAT` (the same
# token pr-review.yml's `review`/`approve-check` jobs use), not the default
# GITHUB_TOKEN. This repository's org-wide `default_workflow_permissions` is
# `read`, and — verified live against a real fork PR, opencloudtouch/
# opencloudtouch#433 — that caps the auto-issued GITHUB_TOKEN to read-only
# for every trigger type tried (`workflow_run` and `pull_request_target`
# both got 403 "Resource not accessible by integration" despite an explicit
# `permissions:` block). A personal access token isn't subject to that org
# policy, which is why pr-review.yml's PAT-authenticated writes already work
# today. `download-artifact` still uses GITHUB_TOKEN, since reading
# artifacts only needs `actions: read`, which the default read-only token
# already has.
#
# IMPORTANT: for a `pull_request` run from a fork, GitHub executes the FORK'S
# OWN COPY of ci.yml — so the `pr_number` inside a staged JSON payload is
# attacker-influenced, not trustworthy. This workflow never uses it to decide
# which PR to comment on: the target PR is always resolved independently from
# the trusted `workflow_run` event (via `pull_requests`, or a head-repo/branch
# lookup when that's empty, as it is for fork PRs). Without this, a fork PR
# could redirect this workflow's real write access at an arbitrary PR.
# ==============================================================================

name: PR Comment Relay

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  post-comments:
    name: Post staged PR comments
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      actions: read

    steps:
      - name: Download staged comment payloads
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: pr-comment-*
          merge-multiple: true
          path: ./pr-comment-payloads
          if-no-artifact-found: ignore

      - name: Post or update sticky comments
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.BOT_PAT }}
          script: |
            const fs = require('fs');

            // Resolve which PR this run belongs to from the trusted
            // workflow_run event — never from the artifact payload. For a
            // fork PR, ci.yml ran with the fork's own copy of the workflow
            // file, so anything the payload claims (including pr_number) is
            // attacker-influenced.
            const runPRs = context.payload.workflow_run.pull_requests || [];
            let issueNumber;
            if (runPRs.length > 0) {
              issueNumber = runPRs[0].number;
            } else {
              // Empty for fork-originated runs — resolve via the head
              // repo owner + branch instead of the commit SHA:
              // `listPullRequestsAssociatedWithCommit` does not reliably
              // return open PRs for fork-originated commits (verified live
              // against opencloudtouch/opencloudtouch#433).
              const headOwner = context.payload.workflow_run.head_repository.owner.login;
              const headBranch = context.payload.workflow_run.head_branch;
              const { data: openPulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${headOwner}:${headBranch}`,
                state: 'open',
              });
              if (openPulls.length === 0) {
                console.log(`No open PR found for ${headOwner}:${headBranch} — nothing to comment on.`);
                return;
              }
              issueNumber = openPulls[0].number;
            }

            const dir = './pr-comment-payloads';

            if (!fs.existsSync(dir)) {
              console.log('No staged PR comment payloads found — nothing to do.');
              return;
            }

            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            if (files.length === 0) {
              console.log('No staged PR comment payloads found — nothing to do.');
              return;
            }

            for (const file of files) {
              const payload = JSON.parse(fs.readFileSync(`${dir}/${file}`, 'utf8'));
              const { marker, body } = payload;

              if (payload.pr_number && payload.pr_number !== issueNumber) {
                console.log(`WARNING: ${file} claimed pr_number ${payload.pr_number} but this run belongs to PR #${issueNumber} — ignoring the claimed value.`);
              }

              if (!marker || !body) {
                console.log(`Skipping ${file}: missing marker or body.`);
                continue;
              }

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              const existing = comments.find(c => c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                console.log(`Updated comment ${existing.id} on PR #${issueNumber} (${marker}).`);
              } else {
                const { data: created } = await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body,
                });
                console.log(`Created comment ${created.id} on PR #${issueNumber} (${marker}).`);
              }
            }
