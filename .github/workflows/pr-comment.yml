# ==============================================================================
# PR COMMENT RELAY
#
# Posts/updates the sticky PR comments (CI summary, commit-lint failure) that
# ci.yml's jobs stage as JSON artifacts instead of posting directly.
#
# Runs via `pull_request_target`, which always executes this file (never the
# fork's copy) with this repository's normal GITHUB_TOKEN permissions — never
# the read-only token GitHub forces on `pull_request`-triggered runs from
# forks. This workflow never checks out or runs any code from the PR; it only
# reads the small JSON payloads that ci.yml's own trusted jobs already staged
# as artifacts. `github.event.pull_request.number` comes straight from the
# trusted event context, so unlike a payload staged by the fork's own copy of
# ci.yml, it can't be forged by the PR author.
#
# Previously this ran via `workflow_run` (triggered when `CI` completed),
# which gave the same trusted-context guarantee. That was abandoned because
# this repository's org-wide `default_workflow_permissions` is `read`, and
# `workflow_run` runs cannot elevate past that default even with an explicit
# `permissions:` block — every write attempt got a 403 "Resource not
# accessible by integration" (verified live against a real fork PR,
# opencloudtouch/opencloudtouch#433). `pull_request_target` isn't subject to
# that ceiling (verified: pr-review.yml already elevates write permissions
# successfully on this trigger), at the cost of no longer being told when CI
# finished — this workflow starts around the same time as `ci.yml` and has to
# poll for its completion itself (see the wait step below).
# ==============================================================================

name: PR Comment Relay

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Roughly 4x the ~5 minute average full-suite duration observed for this
# workflow, so it keeps working if the test suite doubles in size, plus
# margin for runner queue delays under load.
env:
  CI_WAIT_TIMEOUT_MINUTES: 20
  CI_WAIT_POLL_SECONDS: 30

permissions: {}

jobs:
  post-comments:
    name: Post staged PR comments
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      issues: write

    steps:
      - name: Wait for the matching CI run to complete
        id: wait-for-ci
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          POLL_SECONDS: ${{ env.CI_WAIT_POLL_SECONDS }}
          TIMEOUT_MINUTES: ${{ env.CI_WAIT_TIMEOUT_MINUTES }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            const timeoutMinutes = Number(process.env.TIMEOUT_MINUTES);
            const pollMs = Number(process.env.POLL_SECONDS) * 1000;
            const deadline = Date.now() + timeoutMinutes * 60 * 1000;

            let run;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: headSha,
              });
              const candidate = data.workflow_runs
                .filter(r => r.name === 'CI')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

              if (candidate && candidate.status === 'completed') {
                run = candidate;
                break;
              }
              await new Promise(resolve => setTimeout(resolve, pollMs));
            }

            if (!run) {
              console.log(`Timed out after ${timeoutMinutes} minutes waiting for the CI run on ${headSha} to complete — no summary comment will be posted.`);
              core.setOutput('run_id', '');
              return;
            }
            if (run.conclusion === 'cancelled') {
              console.log(`CI run ${run.id} on ${headSha} was cancelled — nothing to comment on.`);
              core.setOutput('run_id', '');
              return;
            }
            core.setOutput('run_id', String(run.id));

      - name: Download staged comment payloads
        if: steps.wait-for-ci.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.wait-for-ci.outputs.run_id }}
          pattern: pr-comment-*
          merge-multiple: true
          path: ./pr-comment-payloads
          if-no-artifact-found: ignore

      - name: Post or update sticky comments
        if: steps.wait-for-ci.outputs.run_id != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            // Trusted directly from the pull_request_target event context —
            // not from the artifact payload, which ci.yml's fork-side copy
            // could have forged.
            const issueNumber = context.payload.pull_request.number;

            const dir = './pr-comment-payloads';

            if (!fs.existsSync(dir)) {
              console.log('No staged PR comment payloads found — nothing to do.');
              return;
            }

            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            if (files.length === 0) {
              console.log('No staged PR comment payloads found — nothing to do.');
              return;
            }

            for (const file of files) {
              const payload = JSON.parse(fs.readFileSync(`${dir}/${file}`, 'utf8'));
              const { marker, body } = payload;

              if (payload.pr_number && payload.pr_number !== issueNumber) {
                console.log(`WARNING: ${file} claimed pr_number ${payload.pr_number} but this run belongs to PR #${issueNumber} — ignoring the claimed value.`);
              }

              if (!marker || !body) {
                console.log(`Skipping ${file}: missing marker or body.`);
                continue;
              }

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              const existing = comments.find(c => c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                console.log(`Updated comment ${existing.id} on PR #${issueNumber} (${marker}).`);
              } else {
                const { data: created } = await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body,
                });
                console.log(`Created comment ${created.id} on PR #${issueNumber} (${marker}).`);
              }
            }
