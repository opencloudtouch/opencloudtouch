# ==============================================================================
# AI PR REVIEW — oct-support bot
#
# Phase 1 (review): Triggered when oct-support is requested as reviewer.
#   → AI analyzes the diff and submits a qualified review with inline comments.
#
# Phase 2 (approve): Triggered on new pushes to reviewed PRs.
#   → Checks if all oct-support review threads are resolved.
#   → If yes, auto-approves the PR.
# ==============================================================================

name: PR Review (oct-support)

on:
  pull_request_target:
    types: [opened, review_requested, synchronize]

permissions:
  contents: read
  pull-requests: read
  models: read

jobs:
  # ============================================================================
  # COMMUNITY PR WELCOME & FEEDBACK
  # ============================================================================
  welcome:
    name: Welcome & Guide
    runs-on: ubuntu-latest
    # Only for external contributors (fork PRs) when PR is opened
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.action == 'opened'
      && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Welcome comment and contributor label
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const marker = '<!-- oct-contributor-welcome:v1 -->';
            const trustedLabel = 'contributor:trusted';

            // Merged PRs of this author (all time). GitHub's "approve workflow
            // runs for first-time contributors" gate lifts after the first
            // merged contribution, so one merged PR means CI runs unattended.
            const { data: merged } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:pr is:merged author:${author}`,
              per_page: 1,
            });
            const mergedCount = merged.total_count;
            const isTrusted = mergedCount >= 1;

            if (isTrusted) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: trustedLabel });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner, repo, name: trustedLabel, color: '0e8a16',
                  description: 'Author has at least one merged PR; CI runs without approval',
                });
              }
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: [trustedLabel],
              });
            }

            // One welcome-style comment per PR (guards against re-delivery).
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            if (comments.some(c => c.body && c.body.includes(marker))) return;

            const checks = `In the meantime, you can run the checks locally:\n\n`
              + `\`\`\`bash\n`
              + `# Backend\n`
              + `cd apps/backend && pip install -r requirements-dev.txt\n`
              + `pytest tests/unit -x -q\n`
              + `ruff check src/\n\n`
              + `# Frontend\n`
              + `cd apps/frontend && npm ci\n`
              + `npm test\n`
              + `npx eslint src/\n`
              + `\`\`\`\n\n`;
            const checklist = `#### ✅ PR Checklist\n\n`
              + `- [ ] Commit messages follow [Conventional Commits](https://www.conventionalcommits.org/) format\n`
              + `- [ ] Tests added/updated for changed code\n`
              + `- [ ] Code formatted (Python: \`black\`, TypeScript: \`prettier\`)\n\n`
              + `📖 See [CONTRIBUTING.md](https://github.com/${owner}/${repo}/blob/main/.github/CONTRIBUTING.md) for details.\n`;

            let body = `${marker}\n`;
            if (!isTrusted) {
              body += `### 👋 Welcome @${author}!\n\n`;
              body += `Thanks for your first contribution to OpenCloudTouch!\n\n`;
              body += `#### ⏳ CI Pipeline\n\n`;
              body += `Because this is your first contribution, GitHub holds the CI run until a maintainer `;
              body += `approves it. This happens **once**: after your first merged PR, checks run automatically `;
              body += `and your PRs are labelled \`${trustedLabel}\`. We'll approve this run shortly.\n\n`;
              body += checks + checklist;
            } else {
              body += `### Thanks @${author}, PR received\n\n`;
              body += `You already have ${mergedCount} merged PR${mergedCount === 1 ? '' : 's'} here, so CI runs `;
              body += `automatically without maintainer approval (label \`${trustedLabel}\`).\n\n`;
              body += checklist;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number, body,
            });

  # ============================================================================
  # PHASE 1: AI REVIEW — when oct-support is requested as reviewer
  # ============================================================================
  review:
    name: PR Review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.requested_reviewer.login == 'oct-support'

    steps:
      - name: "Checkout base branch (security: never run PR code)"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r scripts/pr_reviewer/requirements.txt

      - name: Restore cost tracker cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/ai-cost-tracker
          key: pr-review-cost-${{ github.run_id }}
          restore-keys: |
            pr-review-cost-

      - name: Run AI review
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO_FULL_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MODE: review
        run: python scripts/pr_reviewer/main.py

      - name: Save cost tracker cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: /tmp/ai-cost-tracker
          key: pr-review-cost-${{ github.run_id }}

  # ============================================================================
  # PHASE 2: AUTO-APPROVE — when new commits are pushed to a reviewed PR
  # Uses pull_request_target to always run code from base branch (main),
  # preventing malicious PR code from manipulating the approve logic.
  # ============================================================================
  approve-check:
    name: Approve Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.action == 'synchronize'

    steps:
      - name: "Checkout base branch (security: never run PR code)"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r scripts/pr_reviewer/requirements.txt

      - name: Check and approve
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
          REPO_FULL_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MODE: approve
        run: python scripts/pr_reviewer/main.py


