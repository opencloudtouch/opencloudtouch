# ==============================================================================
# POST-RELEASE WORKFLOW — changelog, announcement, welcome-post version
#
# Trigger: called by release.yml after the release is published (a release
#          published with GITHUB_TOKEN never fires `release: published`, which is
#          why this used to be skipped), manually for a past version, or by
#          `release: published` for releases published by hand.
#
# Steps:
#   1. CHANGELOG.md: [Unreleased] -> [X.Y.Z] - YYYY-MM-DD (curated text is kept;
#      commit subjects are only the fallback), pushed to main
#   2. Announcement discussion built from that changelog section
#   3. "Current Version" line of the welcome discussion updated
#
# Discussions are written with RELEASE_TOKEN: the org caps GITHUB_TOKEN to read-only.
# ==============================================================================

name: Release · Post-Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Released version (e.g. "2.0.0")'
        required: true
        type: string
    secrets:
      RELEASE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version (e.g. "2.0.0")'
        required: true
        type: string
      skip_announcement:
        description: 'Skip creating announcement discussion'
        required: false
        type: boolean
        default: false
      skip_changelog:
        description: 'Skip updating CHANGELOG.md'
        required: false
        type: boolean
        default: false
  release:
    types: [published]

env:
  REPO_NODE_ID: "R_kgDORCYFTw"
  ANNOUNCEMENT_CATEGORY_ID: "DIC_kwDORCYFT84C5HnX"
  WELCOME_DISCUSSION: "64"

# Least-privilege: no default permissions. Jobs declare what they need.
permissions: {}

jobs:
  resolve:
    name: Resolve Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_semver: ${{ steps.version.outputs.is_semver }}
    steps:
      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          # Non-semver release tags (e.g. the "raspi-latest" image alias) also fire
          # `release: published` but are not app releases.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_semver=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_semver=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping non-semver release '$VERSION'"
          fi

  changelog:
    name: Update Changelog
    runs-on: ubuntu-24.04
    needs: resolve
    if: needs.resolve.outputs.is_semver == 'true' && inputs.skip_changelog != true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Promote [Unreleased] to the released version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | grep -Fxv "$TAG" | head -1 || true)
          git log "${PREV_TAG:+$PREV_TAG..}$TAG" --no-merges --pretty=format:%s > "$RUNNER_TEMP/commits.txt"
          python3 scripts/release_notes.py promote CHANGELOG.md "$VERSION" "$(date +%Y-%m-%d)" "$RUNNER_TEMP/commits.txt"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md already up to date"
          else
            git commit -m "docs: update CHANGELOG.md for v${VERSION}"
            git push origin main
          fi

  announcement:
    name: Create Announcement
    runs-on: ubuntu-24.04
    needs: [resolve, changelog]
    if: >-
      always() && needs.resolve.outputs.is_semver == 'true' &&
      needs.changelog.result != 'failure' && inputs.skip_announcement != true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Create the announcement discussion
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="v${VERSION} Released"
          if gh api graphql -f query='query($o:String!,$r:String!,$c:ID!){repository(owner:$o,name:$r){discussions(first:20,categoryId:$c,orderBy:{field:CREATED_AT,direction:DESC}){nodes{title}}}}' \
               -f o="${REPO%/*}" -f r="${REPO#*/}" -f c="$ANNOUNCEMENT_CATEGORY_ID" \
               --jq '.data.repository.discussions.nodes[].title' | grep -Fxq "$TITLE"; then
            echo "::warning::'$TITLE' already exists, skipping"
            exit 0
          fi

          NOTES=$(python3 scripts/release_notes.py extract CHANGELOG.md "$VERSION" | head -c 30000)
          {
            echo "## What's new in v${VERSION}"
            echo
            if [ -n "$NOTES" ]; then echo "$NOTES"; else echo "See the [release notes](https://github.com/${REPO}/releases/tag/${TAG})."; fi
            echo
            echo "---"
            echo
            echo "### How to update"
            echo
            echo "**Docker (recommended):**"
            echo '```bash'
            echo "docker pull ghcr.io/${REPO}:${VERSION}"
            echo "docker compose up -d"
            echo '```'
            echo
            echo "**Raspberry Pi:** download the updated SD card image from the [release page](https://github.com/${REPO}/releases/tag/${TAG})."
            echo
            echo "Full release notes: [v${VERSION}](https://github.com/${REPO}/releases/tag/${TAG})"
          } > "$RUNNER_TEMP/announcement.md"

          gh api graphql \
            -f repositoryId="$REPO_NODE_ID" -f categoryId="$ANNOUNCEMENT_CATEGORY_ID" \
            -f title="$TITLE" -F body=@"$RUNNER_TEMP/announcement.md" \
            -f query='mutation($repositoryId:ID!,$categoryId:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repositoryId,categoryId:$categoryId,title:$title,body:$body}){discussion{url}}}' \
            --jq '.data.createDiscussion.discussion.url'

  welcome-version:
    name: Update welcome discussion
    runs-on: ubuntu-24.04
    needs: resolve
    if: needs.resolve.outputs.is_semver == 'true' && inputs.skip_announcement != true
    steps:
      - name: Set "Current Version" in the welcome discussion
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){discussion(number:$n){id body}}}' \
            -f o="${REPO%/*}" -f r="${REPO#*/}" -F n="$WELCOME_DISCUSSION" --jq '.data.repository.discussion' > "$RUNNER_TEMP/welcome.json"
          python3 - "$RUNNER_TEMP" "$VERSION" "$TAG" "$REPO" <<'PY'
          import json, re, sys
          tmp, version, tag, repo = sys.argv[1:]
          d = json.load(open(f"{tmp}/welcome.json", encoding="utf-8"))
          line = f"## Current Version: [v{version}](https://github.com/{repo}/releases/tag/{tag})"
          body, n = re.subn(r"^## Current Version:.*$", line, d["body"].replace("\r", ""), flags=re.M)
          if n != 1:
              sys.exit("'## Current Version:' line not found exactly once")
          open(f"{tmp}/welcome.md", "w", encoding="utf-8", newline="\n").write(body)
          open(f"{tmp}/welcome.id", "w").write(d["id"])
          PY
          gh api graphql -f id="$(cat "$RUNNER_TEMP/welcome.id")" -F body=@"$RUNNER_TEMP/welcome.md" \
            -f query='mutation($id:ID!,$body:String!){updateDiscussion(input:{discussionId:$id,body:$body}){discussion{url}}}' \
            --jq '.data.updateDiscussion.discussion.url'
