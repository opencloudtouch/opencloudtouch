name: AI · Issue Handler

on:
  issues:
    types: [opened, closed]
  issue_comment:
    types: [created, edited]
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

concurrency:
  group: issue-handler-${{ github.event.issue.number || github.event.discussion.number || github.run_id }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read
  discussions: read

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # includes the 5-10 minute wait before the first answer
    # Skip:
    # - PR comments (handled by pr-review.yml)
    # - Bot's own comments (prevent loops)
    # - Issues with 'spec' label (internal planning, not user-facing)
    if: >-
      (github.event_name != 'issue_comment' || !github.event.issue.pull_request)
      && (github.event_name != 'issue_comment' || github.event.comment.user.login != 'scheilch')
      && !contains(github.event.issue.labels.*.name, 'spec')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore cost tracker cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/ai-cost-tracker
          key: ai-cost-tracker-${{ github.run_id }}
          restore-keys: |
            ai-cost-tracker-

      - name: Run issue handler
        id: handler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_PAT: ${{ secrets.BOT_PAT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_EVENT_TYPE: ${{ github.event_name }}
          # Dry-run until the repository variable OCT_BOT_DRY_RUN is set to "false"
          OCT_BOT_DRY_RUN: ${{ vars.OCT_BOT_DRY_RUN || 'true' }}
        run: python scripts/issue_handler/main.py

      - name: Save cost tracker cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: /tmp/ai-cost-tracker
          key: ai-cost-tracker-${{ github.run_id }}
