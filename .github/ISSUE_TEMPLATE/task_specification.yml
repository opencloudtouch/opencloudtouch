name: "📋 Technical Specification"
description: "Detailed technical specification for features, bugs, or infrastructure work. For planning and implementation."
title: "[Spec]: "
labels: ["spec"]
body:
  - type: markdown
    attributes:
      value: |
        **This template is for detailed technical planning (features, bugs, infrastructure) — typically created by maintainers after triage.**
        If you're a user wanting to report a bug or suggest a feature, please use the appropriate user-facing template instead.

  - type: dropdown
    id: work_type
    attributes:
      label: Work Type
      description: "What kind of work is this?"
      options:
        - Feature / Enhancement
        - Bug Fix
        - Infrastructure / DevOps
        - Refactoring / Tech Debt
        - Documentation
        - Performance
        - Security
      default: 0
    validations:
      required: true

  - type: input
    id: related_issue
    attributes:
      label: Related Issue
      description: "Link to the original bug report, feature request, or discussion (if any)"
      placeholder: "#123"
    validations:
      required: false

  - type: textarea
    id: overview
    attributes:
      label: Problem & Solution Overview
      description: "What problem are we solving? What's our approach? Why this solution?"
      placeholder: |
        Describe the current situation, the problem or need, the intended outcome, and why the proposed approach is appropriate.
    validations:
      required: true

  - type: textarea
    id: user_stories
    attributes:
      label: User Stories (Optional for Bugs/Infra)
      description: "Who needs this? What do they want to accomplish? (Skip for internal bugs/infra unless user-facing)"
      placeholder: |
        - **As a** [user], **I want to** [capability] **so that** [benefit]
      value: |
        - **As a** [user type], **I want to** [action] **so that** [benefit]
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: "Concrete, testable conditions that define when this work is complete. Use Given/When/Then format."
      placeholder: |
        - **Given** [context], **when** [action], **then** [observable result]
      value: |
        - **Given** [context], **when** [action], **then** [expected outcome]
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Implementation Tasks
      description: "Break down the work into concrete tasks. Use checkboxes and adapt the task groups to the work."
      placeholder: |
        Group tasks as appropriate for the work, for example:
        - [ ] Investigation or design
        - [ ] Implementation
        - [ ] Validation
        - [ ] Documentation or rollout
      value: |
        - [ ] [Investigation or design task]
        - [ ] [Implementation task]
        - [ ] [Validation task]
        - [ ] [Documentation or rollout task, if applicable]
    validations:
      required: true

  - type: textarea
    id: api_changes
    attributes:
      label: Interface Changes
      description: "Describe any interface, data-format, or compatibility changes, if applicable."
      placeholder: |
        - Existing interface or behavior:
        - Proposed change:
        - Compatibility or migration considerations:
    validations:
      required: false

  - type: textarea
    id: test_strategy
    attributes:
      label: Test Strategy
      description: "How will this work be validated? What failure and boundary cases need coverage?"
      placeholder: |
        **Automated checks:**
        - [Checks and scenarios to run]

        **Failure and boundary cases:**
        - [Relevant cases]

        **Manual verification (if applicable):**
        - [Steps and expected results]
    validations:
      required: false

  - type: textarea
    id: affected_components
    attributes:
      label: Affected Components
      description: "Which areas or materials are expected to change?"
      placeholder: |
        List affected areas, modules, files, users, or external dependencies, as applicable.
    validations:
      required: false

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of Done
      description: "List verifiable completion conditions that apply to this work. Use the repository Definition of Done as a baseline; mark inapplicable items as n/a with a reason."
      placeholder: |
        - [ ] All tasks completed
        - [ ] All acceptance criteria met
        - [ ] Relevant validation completed and evidence recorded
        - [ ] Documentation updated where needed
        - [ ] Changes reviewed and accepted
        - [ ] Follow-up work recorded, if any
      value: |
        - [ ] All tasks completed
        - [ ] All acceptance criteria met
        - [ ] Relevant validation completed and evidence recorded
        - [ ] Documentation updated where needed
        - [ ] Changes reviewed and accepted
        - [ ] Follow-up work recorded, if any
    validations:
      required: true

  - type: checkboxes
    id: definition_of_ready
    attributes:
      label: Definition of Ready
      description: "Confirm that this spec can be implemented without open questions. Use the repository Definition of Ready as the full criteria; a reviewer re-checks it before implementation."
      options:
        - label: "Problem, user story and originating issue/discussion are described; scope and out of scope are explicit"
          required: true
        - label: "Affected areas are identified and the work is split into reviewable parts where needed"
          required: true
        - label: "Acceptance criteria are testable (Given/When/Then), cover relevant failure cases and edge cases, and are consistent across affected areas"
          required: true
        - label: "Relevant interfaces, data, configuration, compatibility, and claims about existing behavior are specified and verified"
          required: true
        - label: "User-facing behavior, accessibility, and localization are considered where relevant"
          required: true
        - label: "Validation strategy and any external dependencies or assumptions are defined"
          required: true
        - label: "Security, privacy, risks, and trade-offs are considered where relevant"
          required: true
        - label: "Dependencies, ordering, documentation impact, and open questions are addressed"
          required: true
        - label: "The spec was reviewed by someone other than the author (or independent reviewers) and the findings are incorporated"
          required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies & Blockers
      description: "What needs to happen before this can be implemented? Any external dependencies?"
      placeholder: |
        - Depends on [work item] being completed first
        - Blocked by [external dependency or decision]
        - Requires a decision on [open question]
    validations:
      required: false

  - type: textarea
    id: risks
    attributes:
      label: Risks & Considerations
      description: "What could go wrong? What trade-offs are we making?"
      placeholder: |
        - [Risk and likelihood]
        - [Potential impact and mitigation]
        - [Trade-off or limitation]
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "How urgent/important is this feature?"
      options:
        - "🔥 Critical (blocks other work)"
        - "⬆️ High (next sprint)"
        - "➡️ Medium (backlog, planned)"
        - "⬇️ Low (nice-to-have)"
    validations:
      required: false

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      description: "Rough effort estimate (for planning purposes)"
      options:
        - "XS (< 1 day)"
        - "S (1-2 days)"
        - "M (3-5 days)"
        - "L (1-2 weeks)"
        - "XL (> 2 weeks)"
    validations:
      required: false
