# Label taxonomy managed by labels_sync.py. Entries not listed here are never touched.
# description is optional: when omitted, the existing description is kept.
labels:
  - name: "phase:new"
    color: "cfe0fa"
    description: "Newly filed, not yet looked at"
  - name: "phase:draft"
    color: "cfe0fa"
    description: "Being drafted by the author"
  - name: "phase:triaged"
    color: "a8c5f3"
    description: "Accepted by a maintainer"
    rename_from: "accepted"
  - name: "phase:spec-review"
    color: "a8c5f3"
    description: "Specification is under review"
  - name: "phase:spec-rework"
    color: "a8c5f3"
    description: "Specification needs rework after review"
  - name: "phase:confirmed"
    color: "7ba3ec"
    description: "Bug reproduced and confirmed by a maintainer"
  - name: "phase:ready"
    color: "5b8ee6"
    description: "Ready for implementation"
  - name: "phase:in-progress"
    color: "3a73d8"
    description: "Implementation in progress"
    rename_from: "wip"
  - name: "phase:in-review"
    color: "2a5cc0"
    description: "Pull request in review"
  - name: "phase:verification"
    color: "1e4590"
    description: "Awaiting verification"
  - name: "phase:done"
    color: "1a7f37"
    description: "Completed"
  - name: "phase:merged"
    color: "1a7f37"
    description: "Pull request merged"
  - name: "phase:closed"
    color: "6e7781"
    description: "Closed without completion"
  - name: "phase:open"
    color: "cfe0fa"
    description: "Discussion is open"
  - name: "phase:needs-spec"
    color: "a8c5f3"
    description: "Discussion needs a specification"
  - name: "phase:specified"
    color: "5b8ee6"
    description: "Discussion led to a specification"
  - name: "phase:answered"
    color: "1a7f37"
    description: "Discussion is answered"
  - name: "wait:maintainer"
    color: "f2a33a"
    description: "Waiting for a maintainer"
  - name: "wait:findings"
    color: "f2a33a"
    description: "Waiting for review findings to be addressed"
  - name: "wait:ci"
    color: "f2a33a"
    description: "Waiting for CI"
  - name: "wait:prerequisite"
    color: "f2a33a"
    description: "Waiting for a prerequisite"
    rename_from: "blocked"
  - name: "wait:hardware-test"
    color: "f2a33a"
    description: "Waiting for a hardware test"
  - name: "wait:spec-fix"
    color: "f2a33a"
    description: "Waiting for a specification fix"
  - name: "wait:reporter"
    color: "f2a33a"
    description: "Waiting for the reporter"
    rename_from: "needs-info"
  - name: "wait:designer"
    color: "f2a33a"
    description: "Waiting for the designer"
  - name: "resolution:duplicate"
    color: "c9d1d9"
    description: "Duplicate of another item"
    rename_from: "duplicate"
  - name: "resolution:wontfix"
    color: "c9d1d9"
    description: "Will not be worked on"
    rename_from: "wontfix"
  - name: "resolution:invalid"
    color: "c9d1d9"
    description: "Not valid"
    rename_from: "invalid"
  - name: "resolution:not-reproducible"
    color: "c9d1d9"
    description: "Could not be reproduced"
  - name: "resolution:works-as-designed"
    color: "c9d1d9"
    description: "Behaves as designed"
  - name: "resolution:superseded"
    color: "c9d1d9"
    description: "Superseded by another item"
  - name: "resolution:abandoned"
    color: "c9d1d9"
    description: "Abandoned by the author"
  - name: "spec"
    color: "8250df"
  - name: "enhancement"
    color: "b8f0c6"
