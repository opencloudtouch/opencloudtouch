[project]
name = "oct-status"
version = "0.1.0"
description = "Status system (phase, wait, resolution) for OpenCloudTouch issues and pull requests"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
explicit_package_bases = false
mypy_path = ".."
exclude = ["tests/", "__main__\\.py$"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "conftest.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
