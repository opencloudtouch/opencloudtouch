<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#0d0d0d}</style>
</helmet>
<div style="min-height:100vh;background:#0d0d0d;color:#e0e0e0;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column">
  <div style="position:sticky;top:0;z-index:5;background:#141414;border-bottom:1px solid #333;padding:12px 16px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center">
      <div style="font-weight:700;font-size:14px;color:#fff">OCT Wizard · Stufe 3 · Schritte 5–8</div>
      <div style="font-size:12px;padding:3px 10px;border-radius:999px;{{ auditStyle }}">{{ auditText }}</div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px 20px">
      <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center"><span style="font-size:12px;color:#949494;margin-right:4px">Schritt</span><sc-for list="{{ steps }}" as="b" hint-placeholder-count="4"><button onClick="{{ b.on }}" style="{{ b.style }}">{{ b.label }}</button></sc-for></div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center"><span style="font-size:12px;color:#949494;margin-right:4px">Breite</span><sc-for list="{{ widths }}" as="b" hint-placeholder-count="5"><button onClick="{{ b.on }}" style="{{ b.style }}">{{ b.label }}</button></sc-for></div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px 20px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
        <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center"><span style="font-size:12px;color:#949494;margin-right:4px">{{ g.label }}</span><sc-for list="{{ g.buttons }}" as="b" hint-placeholder-count="3"><button onClick="{{ b.on }}" style="{{ b.style }}">{{ b.label }}</button></sc-for></div>
      </sc-for>
    </div>
  </div>
  <div style="flex:1;overflow:auto;padding:24px 16px 48px">
    <iframe src="{{ src }}" title="Wizard-Vorschau" style="{{ frameStyle }}"></iframe>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { step: 'dns', width: 375, v: {}, audit: null };
  componentDidMount() {
    this._h = (e) => { if (e.data && e.data.oct === 'audit') this.setState({ audit: { ok: e.data.ok, msg: e.data.msg } }); };
    window.addEventListener('message', this._h);
  }
  componentWillUnmount() { window.removeEventListener('message', this._h); }
  renderVals() {
    const s = this.state;
    const DEF = {
      dns: [['st', 'Zustand', [['form', 'Formular'], ['applying', 'Läuft'], ['error', 'Fehler'], ['success', 'Erfolg']]], ['ip', 'IP', [['std', 'Vorbefüllt'], ['empty', 'Leer'], ['ipv6', 'IPv6']]], ['opt', 'Optionale Domains', [['none', 'Keine'], ['all', 'Alle']]], ['diff', 'Diff', [['0', 'Zu'], ['1', 'Offen']]], ['bk', 'Backup-Pfad', [['1', 'Mit'], ['0', 'Ohne']]]],
      ntp: [['st', 'Zustand', [['form', 'Formular'], ['patching', 'Läuft'], ['error', 'Fehler'], ['success', 'Erfolg']]], ['srv', 'Server', [['std', 'Standard'], ['empty', 'Leer'], ['long', 'Langer Name']]]],
      verify: [['ph', 'Phase', [['f-idle', '1 Bereit'], ['f-run', '1 Läuft'], ['f-err', '1 Fehler'], ['r-idle', '2 Bereit'], ['r-run', '2 Sendet'], ['r-wait', '2 Wartet'], ['r-err', '2 Fehler'], ['r-done', '3 Start'], ['v-run', '3 Läuft'], ['v-ok', '3 Bestanden'], ['v-fail', '3 Fehlgeschlagen'], ['v-err', '3 Fehler']]], ['cd', 'Countdown', [['100', '100 s'], ['42', '42 s'], ['3', '3 s']]], ['ntp', 'NTP', [['0', 'Übersprungen'], ['1', 'Gesetzt']]]],
      done: [['bk', 'Backup', [['1', 'Mit Pfad'], ['0', 'Ohne']]], ['ntp', 'NTP', [['0', 'Übersprungen'], ['1', 'Gesetzt']]], ['dev', 'Gerätename', [['std', 'Kurz'], ['long', 'Lang']]]]
    };
    const pill = (on) => ({ minHeight: 32, padding: '0 12px', borderRadius: 999, border: '1px solid ' + (on ? '#4a90d9' : '#3a3a3a'), background: on ? 'rgba(74,144,217,.2)' : 'transparent', color: on ? '#fff' : '#b3b3b3', font: '500 13px inherit', cursor: 'pointer' });
    const cur = s.v[s.step] || {};
    const val = (k, d) => cur[k] !== undefined ? cur[k] : d[0][0];
    const groups = DEF[s.step].map(([k, label, opts]) => ({
      label,
      buttons: opts.map(([v, l]) => ({ label: l, style: pill(val(k, opts) === v), on: () => this.setState(p => ({ audit: null, v: { ...p.v, [p.step]: { ...(p.v[p.step] || {}), [k]: v } } })) }))
    }));
    const q = DEF[s.step].map(([k, , opts]) => k + '=' + val(k, opts)).join('&');
    const W = s.width;
    const sn = [['dns', '5 DNS'], ['ntp', '6 NTP'], ['verify', '7 Prüfung'], ['done', '8 Fertig']];
    const au = s.audit;
    return {
      steps: sn.map(([k, l]) => ({ label: l, style: pill(s.step === k), on: () => this.setState({ step: k, audit: null }) })),
      widths: [320, 375, 414, 768, 1280].map(w => ({ label: String(w), style: pill(W === w), on: () => this.setState({ width: w, audit: null }) })),
      groups,
      src: 'wizard/stage3-frame.html?step=' + s.step + '&' + q,
      frameStyle: { display: 'block', width: W, height: 'calc(100vh - 240px)', minHeight: 560, margin: '0 auto', border: '1px solid #333', background: '#1a1a1a' },
      auditText: au ? au.msg : 'Prüfe…',
      auditStyle: au ? (au.ok ? 'background:#1b5e20;color:#fff' : 'background:#b71c1c;color:#fff') : 'background:#333;color:#b3b3b3'
    };
  }
}

</script>
</body>
</html>
