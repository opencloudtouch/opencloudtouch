const PA={

Info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
Check:'<path d="M20 6 9 17l-5-5"/>',X:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
ChevronDown:'<path d="m6 9 6 6 6-6"/>',ChevronLeft:'<path d="m15 18-6-6 6-6"/>',ChevronRight:'<path d="m9 18 6-6-6-6"/>',
CircleX:'<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',CircleCheck:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
Alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',

Power:'<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>',
Loader:'<path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/>',
RefreshCw:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',

Trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
Plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',Play:'<polygon points="6 3 20 12 6 21 6 3"/>',

Bluetooth:'<path d="m7 7 10 10-5 5V2l5 5L7 17"/>',

Airplay:'<path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><path d="m12 15 5 6H7Z"/>',
Tv:'<rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/>',

Hourglass:'<path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>',
CircleHelp:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
ArrowLeft:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
ExternalLink:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'};
const I=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${PA[n]||''}</svg>`;
const WI=(n,s)=>`<span class="wz-icon" aria-hidden="true">${I(n,s)}</span>`;
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const ini=s=>s.replace(/[^A-Za-zÄÖÜäöü0-9 ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?';
const avatar=(n,cls)=>`<span class="${cls}" style="background-color:hsl(${hue(n)} 45% 32%);display:flex">${esc(ini(n))}</span>`;

/* ---------- data ---------- */
const LONGDEV='Wohnzimmer Lautsprecher Obergeschoss Süd';
const DEVS=[['Wohnzimmer','SoundTouch 30','192.168.1.21','configured'],['Küche','SoundTouch 10','192.168.1.22','unconfigured'],['Schlafzimmer','SoundTouch 20','192.168.1.23','pending'],['Büro','SoundTouch 10','192.168.1.24','failed'],['Bad','SoundTouch 10','192.168.1.25','outdated'],['Terrasse','SoundTouch 300','192.168.1.26','offline'],['Keller','SoundTouch 10','192.168.1.27','unknown'],['Flur','SoundTouch 10','192.168.1.28','configured'],['Gästezimmer','SoundTouch 20','192.168.1.29','configured'],['Garage','SoundTouch 10','192.168.1.30','configured'],['Dachboden','SoundTouch 10','192.168.1.31','configured'],['Werkstatt','SoundTouch 30','192.168.1.32','configured']];
const LONGNAME='RadioParadiseMainMixHighQualityLosslessFLAC320kbpsInternationalStreamEuropeSouthWest';
const PRESETS={full:['SWR3','Deutschlandfunk','Antenne Bayern','1LIVE','Bayern 3','NDR 2'],mixed:['SWR3',null,'Antenne Bayern',null,null,'NDR 2'],empty:[null,null,null,null,null,null],
long:[LONGNAME,'Bayerischer Rundfunk BAYERN 3 Live aus München – Das Beste aus Pop und Rock der letzten Jahrzehnte','SWR3','Radio Eins vom Rundfunk Berlin-Brandenburg',null,'ÖsterreichischerRundfunkÖ1KulturRadioWienStudioLive']};
const SRCS={
 radio:{src:'INTERNET_RADIO',st:'SWR3',tr:'Don’t Stop Believin’',ar:'Journey',play:true},
 longtrack:{src:'INTERNET_RADIO',st:LONGNAME,tr:'Symphonie Nr. 9 in d-Moll, Op. 125 – IV. Presto – Allegro assai (Ode an die Freude)',ar:'Berliner Philharmoniker, Herbert von Karajan, Wiener Singverein, Gundula Janowitz, Hilde Rössel-Majdan',play:true},
 bt:{src:'BLUETOOTH',st:'iPhone von Alexandra',tr:'Blinding Lights',ar:'The Weeknd',play:true},
 aux:{src:'AUX',st:'',tr:'',ar:'',play:false},
 airplay:{src:'AIRPLAY',st:'MacBook Pro',tr:'Midnight City',ar:'M83',play:true},
 tv:{src:'TV',st:'',tr:'',ar:'',play:false},
 streaming:{src:'SPOTIFY',st:'',tr:'Bohemian Rhapsody – Remastered 2011',ar:'Queen',play:false},
 standby:{src:'STANDBY',st:'',tr:'',ar:'',play:false}};
const ART="<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='300' height='300' fill='#323a46'/><circle cx='150' cy='150' r='90' fill='none' stroke='#58626f' stroke-width='14'/></svg>";
const SRCMAP={BLUETOOTH:['Bluetooth','bluetooth'],INTERNET_RADIO:['Radio','radio'],AUX:['Headphones','aux'],AIRPLAY:['Airplay','airplay'],DLNA:['Speaker','dlna'],TV:['Tv','tv'],SPOTIFY:['Music','streaming']};
const SRCKEY={BLUETOOTH:'bluetooth',INTERNET_RADIO:'radio',AUX:'aux',AIRPLAY:'airplay',DLNA:'dlna',TV:'tv',SPOTIFY:'spotify'};
const STAT={unknown:'CircleHelp',unconfigured:'Settings',configured:'CircleCheck',pending:'Hourglass',failed:'CircleX',outdated:'Alert',offline:'WifiOff'};
const STVAR={unknown:'neutral',unconfigured:'warning',configured:'success',pending:'info',failed:'danger',outdated:'warning',offline:'neutral'};

/* ---------- pieces (markup mirrors the TSX 1:1) ---------- */
function langSel(open){const L=[['Deutsch','DE'],['English','EN'],['Français','FR'],['Español','ES'],['Italiano','IT'],['Nederlands','NL'],['Polski','PL'],['Português','PT'],['Svenska','SV'],['Čeština','CS']];
 return `<div class="lang-selector-wrapper"><button class="lang-selector" aria-label="${t('a11y.selectLanguage')}" aria-expanded="${open}" aria-haspopup="listbox" data-act="lang"><span class="fi lang-flag" aria-hidden="true"></span><span class="lang-code">DE</span></button>${open?`<ul class="lang-dropdown" role="listbox" aria-label="${t('a11y.selectLanguage')}">${L.map(([n,c],i)=>`<li role="option" aria-selected="${i==0}" class="lang-option${i==0?' lang-option--active':''}" tabindex="0"><span class="fi lang-option-flag" aria-hidden="true"></span><span class="lang-option-name">${n}</span><span class="lang-option-code">${c}</span><span class="lang-option-check" aria-hidden="true">${i==0?I('Check',18):''}</span></li>`).join('')}</ul>`:''}</div>`}
function nav(active,open){const L=[['presets','Radio','nav.presets'],['zones','Volume2','nav.zones'],['settings','Settings','nav.settings'],['about','Info','nav.about']];
 return `<nav class="nav" aria-label="${t('nav.ariaLabel')}"><div class="nav-inner"><div class="nav-container">${L.map(([k,ic,lb])=>`<a href="#" class="nav-link"${active===k?' aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${I(ic,22)}</span><span class="nav-label">${t(lb)}</span></a>`).join('')}</div>${langSel(open)}</div></nav>`}
const shell=(inner,active,open)=>`<div class="app"><a class="skip-link" href="#main-content">${t('a11y.skipToContent')}</a><header class="app-header" data-test="app-header">${nav(active,open)}</header><main id="main-content" tabindex="-1" class="app-main">${inner}</main></div>`;
const dlg=(size,role,lb,ds,inner,oa='',pa='')=>`<dialog class="dlg dlg--${size}" role="${role}" aria-modal="true" aria-labelledby="${lb}"${ds?` aria-describedby="${ds}"`:''}><div class="dlg-overlay" role="presentation" ${oa}><div class="dlg-panel" ${pa}>${inner}</div></div></dialog>`;
function confirm(title,msg,ok,cancel,destr,ov){return dlg('sm','alertdialog','confirm-dialog-title','confirm-dialog-message',`<div class="dlg-head"><h2 id="confirm-dialog-title" class="dlg-title">${esc(title)}</h2></div><div class="dlg-body"><p id="confirm-dialog-message" class="dlg-text">${esc(msg)}</p></div><div class="dlg-actions">${cancel?`<button class="btn btn-secondary" data-testid="confirm-dialog-cancel">${cancel}</button>`:''}<button class="btn ${destr?'btn-danger':'btn-primary'}" data-testid="confirm-dialog-confirm">${ok}</button></div>`,'data-testid="confirm-dialog-overlay"')}
const toast=(type,msg,top)=>`<div class="toast toast-${type} toast-visible" data-test="toast-notification" role="${type==='error'||type==='warning'?'alert':'status'}"${top!=null?` style="top:calc(var(--header-h) + 8px + ${top}px)"`:''}><div class="toast-icon" aria-hidden="true">${I({success:'CircleCheck',error:'CircleX',warning:'Alert',info:'Info'}[type],22)}</div><div class="toast-content"><p class="toast-message" data-test="toast-message">${esc(msg)}</p></div><button class="toast-close" aria-label="${t('common.close')}" data-test="toast-close-button">${I('X',18)}</button></div>`;
const alertBox=(kind,icon,msg,close,attrs='')=>`<div class="wz-status wz-status--${kind}" role="alert" ${attrs}>${WI(icon,20)}<div class="wz-status-body"><p>${esc(msg)}</p></div>${close?`<button class="ui-alert-close" aria-label="${t('common.close')}">${I('X',18)}</button>`:''}</div>`;

function setupBadge(st){return `<button class="sb sb--${st}" title="${t('setupBadge.'+st)}" aria-label="${t('setupBadge.'+st)}" data-test="setup-button"><span class="sb-icon" aria-hidden="true">${I(STAT[st],22)}</span></button>`}
function nameBlock(n,nm){const fs=n.length>26?17:n.length>18?20:24;
 if(nm==='edit'||nm==='saving'||nm==='error'||nm==='toolong')return `<div class="dne" data-test="device-name-editor"><h2 class="dne-heading"><span class="dne-field"><input class="ui-input dne-input" type="text" value="${esc(nm==='toolong'?n+' Erweiterung Neu':n)}" maxlength="30" ${nm==='saving'?'disabled':''} aria-label="${t('deviceRename.inputLabel')}" ${nm==='error'||nm==='toolong'?'aria-invalid="true" aria-describedby="device-name-error"':''} data-test="device-name-input">${nm==='saving'?`<span class="dne-saving ui-spin" aria-hidden="true">${I('Loader',18)}</span>`:''}</span></h2>${nm==='error'||nm==='toolong'?`<span id="device-name-error" class="ui-field-error dne-error" role="alert" data-test="device-name-error">${I('CircleX',16)}<span>${t(nm==='error'?'deviceRename.failed':'deviceRename.tooLong')}</span></span>`:''}</div>`;
 return `<h2 class="dne-heading"><button type="button" class="dne-btn" style="font-size:${fs}px" title="${t('deviceRename.clickToEdit')}" data-test="device-name" aria-label="${esc(n)} — ${t('deviceRename.clickToEdit')}"><span class="dne-text">${esc(n)}</span><span class="dne-icon" aria-hidden="true">${I('Pencil',Math.round(fs*.65))}</span></button></h2>`}
function nowPlaying(k){const d=SRCS[k];if(!d)return `<div class="np np--empty"><span class="np-empty-icon" aria-hidden="true">${I('Music',28)}</span><div class="np-placeholder">${t('player.noPlayback')}</div></div>`;
 const m=SRCMAP[d.src],label=SRCKEY[d.src]&&d.src!=='INTERNET_RADIO'?t('player.source.'+SRCKEY[d.src]):null;
 const head=label?(d.st?label+' · '+d.st:label):(d.st||t('player.noStation'));
 const badge=m?`<div class="ui-source np-source ${m[1]}" title="${t('player.source.'+SRCKEY[d.src])}" ${label?'aria-hidden="true"':`role="img" aria-label="${t('player.source.radio')}"`}>${I(m[0],20)}</div>`:'';
 const art=`<div class="np-art"><img alt="" src="data:image/svg+xml;utf8,${encodeURIComponent(ART)}"><button class="np-play-overlay" aria-label="${d.play?t('player.pause'):t('player.play')}">${I(d.play?'Pause':'Play',28)}</button></div>`;
 const mq=(c,x)=>x?`<div class="np-marquee ${c}" title="${esc(x)}"><span class="np-marquee-inner">${esc(x)}</span></div>`:'';
 return `<div class="np"><div class="np-header">${badge}<div class="np-station" title="${esc(d.st)}">${esc(head)}</div></div>${art}<div class="np-info">${mq('np-track',d.tr)}${mq('np-artist',d.ar)}</div></div>`}
function volume(muted,v){const p=muted?v:v;return `<div class="vs"><button class="vs-mute${muted?' muted':''}" aria-label="${muted?t('player.muteOn'):t('player.muteOff')}" aria-pressed="${muted}">${I(muted||v===0?'VolumeX':'Volume2',24)}</button><div class="vs-track${muted?' muted':''}" role="slider" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100" aria-label="${t('a11y.volume')}" tabindex="0"><div class="vs-track-bg"></div><div class="vs-track-fill" style="width:${p}%;background-color:${muted?'#8c8c8c':'#5dade2'}"></div><div class="vs-thumb" style="left:${p}%"></div></div><span class="vs-value" aria-hidden="true">${muted?'–':v}</span></div>`}
function preset(n,name,playing,disabled){
 if(disabled)return `<div class="pb pb--disabled" data-testid="preset-${n}"><div class="pb-info"><span class="pb-num">${n}</span><span class="pb-name pb-name--muted">${t('errors.offlineTitle')}</span></div></div>`;
 if(!name)return `<div class="pb" data-testid="preset-${n}"><button class="pb-empty" data-testid="preset-empty-${n}"><span class="pb-num">${n}</span><span class="pb-placeholder">${t('presets.assignPreset')}</span><span class="pb-plus" aria-hidden="true">${I('Plus',20)}</span></button></div>`;
 return `<div class="pb${playing?' pb--playing':''}" data-testid="preset-${n}"><button class="pb-info" data-testid="preset-play-${n}" title="${t('presets.changeStation')}"><span class="pb-num">${n}</span><div class="pb-logo">${avatar(name,'pb-avatar')}</div><span class="pb-name">${esc(name)}</span></button><button type="button" class="pb-play${playing?' playing':''}" aria-label="${playing?t('player.pause'):t('presets.playPreset',{name})}" data-testid="preset-action-${n}" title="${playing?t('player.pause'):t('player.play')}">${I(playing?'Pause':'Play',22)}</button></div>`}
const skelPreset=()=>`<div class="sk-preset"><div class="ui-skeleton" style="width:28px;height:28px;border-radius:50%"></div><div class="ui-skeleton" style="width:40px;height:40px;border-radius:8px"></div><div class="sk-content"><div class="ui-skeleton" style="width:80%;height:18px;border-radius:4px"></div></div></div>`;

let S={i:+P('i',0),lang:P('lang','closed')==='open'};

 if(p==='badges')h=`<h2 class="sec">Status-Badges (7 Setup-Status, mit Text)</h2><div class="row">${Object.keys(STAT).map(k=>`<div class="ui-badge ui-badge--${STVAR[k]} ui-badge--medium"><span class="ui-badge-icon" aria-hidden="true">${I(STAT[k],16)}</span><span>${t('statusBadge.'+k)}</span></div>`).join('')}</div><h2 class="sec">Nur Icon (Text per aria-label)</h2><div class="row">${Object.keys(STAT).map(k=>`<div class="ui-badge ui-badge--${STVAR[k]} ui-badge--medium ui-badge--icon"><span class="ui-badge-icon" role="img" aria-label="${t('statusBadge.'+k)}">${I(STAT[k],16)}</span></div>`).join('')}</div><h2 class="sec">SetupBadge-Button (44 px)</h2><div class="row">${Object.keys(STAT).map(setupBadge).join('')}</div><h2 class="sec">Quellen-Badges</h2><div class="row">${[['Bluetooth','bluetooth'],['Radio','radio'],['Headphones','aux'],['Airplay','airplay'],['Speaker','dlna'],['Tv','tv'],['Music','spotify']].map(([ic,k])=>`<div class="row" style="gap:8px"><div class="ui-source" aria-hidden="true">${I(ic,20)}</div><span class="ui-small">${t('player.source.'+k)}</span></div>`).join('')}</div>`;
 if(p==='feedback')h=`<h2 class="sec">Inline-Hinweise</h2><div class="col">${alertBox('error','CircleX','Fehlermeldung mit Schließen-Button',true)}${alertBox('warning','Alert','Warnung',false)}${alertBox('success','CircleCheck','Erfolg',false)}<div class="wz-status">${WI('Info',20)}<div class="wz-status-body"><p>Information</p></div></div></div><h2 class="sec">Skeleton / Spinner / Fortschritt</h2><div class="demo">${skelPreset()}${skelPreset()}</div><div class="row"><span class="spinner" aria-hidden="true"></span><span class="wz-spinner" aria-hidden="true"></span><span class="spinner-small" style="border-color:rgba(74,144,217,.3);border-top-color:#4a90d9"></span></div><div class="col"><span class="wz-progress"><span class="wz-progress-bar" style="width:60%"></span></span><span class="wz-progress wz-progress--indeterminate"><span class="wz-progress-bar"></span></span></div><h2 class="sec">Leer-, Fehler-Zustand, Offline-Banner</h2><div class="ui-state"><div class="ui-state-icon" aria-hidden="true">${I('Radio',32)}</div><h2>Keine Geräte gefunden</h2><p>Bitte prüfen Sie, ob die Geräte eingeschaltet sind.</p><button class="btn btn-primary">${t('common.retry')}</button></div><div class="ui-state ui-state--error"><div class="ui-state-icon" aria-hidden="true">${I('Alert',32)}</div><h2>${t('errors.devicesLoadTitle')}</h2><p>${t('errors.devicesLoadMessage')}</p></div><div class="ui-offline-banner" role="status">${I('WifiOff',18)}<span>Keine Verbindung zum Server</span></div>`;
 return `<div class="pg"><h1 class="ui-h1">Primitive: ${p}</h1>${h}</div>`}

function render(){
 const pg=P('page','presets'),root=document.getElementById('root');let h='',ovl='';
 if(pg==='shell')h=shell(`<div class="pg"><h1 class="ui-h1">Navigation</h1><p class="ui-small">Aktiv: ${P('nav','presets')}. Bei ≤ 360 px zeigt nur der aktive Link sein Label.</p></div>`,P('nav','presets'),S.lang);
 else if(pg==='app')h=appStates();
 else if(pg==='welcome'){h=`<div class="app"><main id="main-content" class="app-main" tabindex="-1">${welcome()}</main></div>`;const mo=P('mo','none');if(mo!=='none')ovl=manualIp(mo)}
 else if(pg==='notfound')h=shell(`<div class="nf"><div class="nf-card"><p class="nf-code" aria-hidden="true">404</p><h1 class="nf-title">${t('errors.pageNotFound')}</h1><p class="nf-description">${t('errors.pageNotFoundDescription')}</p><button class="btn btn-primary">${t('errors.backToHome')}</button></div></div>`,'none',false);
 else if(pg==='presets'){h=shell(presetsPage(),'presets',S.lang);const ov=P('ov','none');
  if(ov==='search')ovl=searchDialog(P('sv','results'));
  if(ov==='overwrite')ovl=confirm(t('presets.confirmOverwriteTitle'),t('presets.confirmOverwriteMessage',{preset:3}),t('presets.confirmOverwrite'),t('common.cancel'),false);
  if(ov==='delete')ovl=confirm(t('presets.confirmDeleteTitle'),t('presets.confirmDeleteMessage',{preset:3}),t('presets.confirmDelete'),t('common.cancel'),true);
  if(ov==='removeDevice')ovl=confirm(t('presets.deleteDevice'),'„Terrasse“ wird aus OpenCloudTouch entfernt.',t('presets.deleteDevice'),t('common.cancel'),true);
  if(ov==='toast')ovl=toast('success',t('presets.presetSaved',{number:3}))}
 else if(pg==='search'){h=shell(presetsPage(),'presets',false);ovl=searchDialog(P('sv','results'))}
 else if(pg==='dialogs'){h=shell(presetsPage(),'presets',false);const d=P('d','overwrite');
  ovl=d==='overwrite'?confirm(t('presets.confirmOverwriteTitle'),t('presets.confirmOverwriteMessage',{preset:3}),t('presets.confirmOverwrite'),t('common.cancel'),false):d==='delete'?confirm(t('presets.confirmDeleteTitle'),t('presets.confirmDeleteMessage',{preset:3}),t('presets.confirmDelete'),t('common.cancel'),true):d==='info'?confirm(t('presets.manualStreamErrorTitle'),t('presets.manualStreamUnreachable'),t('presets.manualStreamErrorOk'),'',false):confirm(t('presets.deleteDevice'),'„Terrasse“ wird aus OpenCloudTouch entfernt. Das Gerät kann später erneut gesucht werden.',t('presets.deleteDevice'),t('common.cancel'),true)}
 else if(pg==='toasts')h=toastsPage();
 else if(pg==='primitives')h=`<div style="height:100vh;overflow:auto" tabindex="0" role="region" aria-label="Primitive">${prim()}</div>`;
 root.innerHTML=h+ovl;
 root.querySelectorAll('dialog.dlg').forEach(d=>{if(!d.open)d.showModal()});
 marquee();
}
function marquee(){document.querySelectorAll('.np-marquee').forEach((w,k)=>{const s=w.firstElementChild;if(k===0&&s.scrollWidth>w.clientWidth+1){const d=s.scrollWidth-w.clientWidth;s.classList.add('np-marquee-inner--scrolling');s.style.setProperty('--marquee-distance',`-${d}px`);s.style.animationDuration=Math.max(6,d/10)+'s'}})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(a==='prev')S.i=Math.max(0,S.i-1);if(a==='next')S.i=S.i+1;if(a==='dot')S.i=+b.dataset.i;if(a==='lang')S.lang=!S.lang;render();setTimeout(audit,200)});

/* ---------- audit ---------- */
const pc=c=>{const m=c.match(/[\d.]+/g).map(Number);return{r:m[0],g:m[1],b:m[2],a:m[3]==null?1:m[3]}};
const over=(f,b)=>({r:f.r*f.a+b.r*(1-f.a),g:f.g*f.a+b.g*(1-f.a),b:f.b*f.a+b.b*(1-f.a),a:1});
function bgOf(el){const ch=[];for(let e=el;e;e=e.parentElement){const c=pc(getComputedStyle(e).backgroundColor);if(c.a>0)ch.push(c);if(c.a>=1)break}let b={r:26,g:26,b:26,a:1};if(ch.length&&ch[ch.length-1].a>=1)b=ch.pop();ch.reverse().forEach(c=>b=over(c,b));return b}
const lum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c.r)+.7152*f(c.g)+.0722*f(c.b)};
function audit(){
 const vw=document.documentElement.clientWidth,R='#root',bad=[];
 const vis=e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0};
 const clipped=e=>{const r=e.getBoundingClientRect();for(let p=e.parentElement;p&&p.id!=='root';p=p.parentElement){const o=getComputedStyle(p).overflowY;if(/(auto|scroll|hidden|clip)/.test(o)&&p.scrollHeight>p.clientHeight+1){const q=p.getBoundingClientRect();if(r.top<q.top-1||r.bottom>q.bottom+1)return true}}return false};
 document.querySelectorAll(R+' *').forEach(el=>{if(el.closest('.np-marquee,.es-help ul'))return;const r=el.getBoundingClientRect();if(r.width&&(r.right>vw+1||r.left<-1)&&!el.closest('.ds-viewport,.dlg'))bad.push(el.className||el.tagName)});
 const small=[...document.querySelectorAll(R+' button,'+R+' a[href],'+R+' summary,'+R+' [role=slider],'+R+' [role=option],'+R+' input:not([type=hidden]),'+R+' select,'+R+' textarea')].filter(e=>{if(e.closest('.visually-hidden')||e.matches('.nav-label *'))return false;const r=e.getBoundingClientRect();if(!r.width||!r.height)return false;if(e.matches('.ui-toggle input'))return false;if(getComputedStyle(e).position==='absolute'&&r.width<=1)return false;if(clipped(e))return false;return r.height<43.5||r.width<43.5}).map(e=>e.className||e.tagName);
 const ov=[],els=[...document.querySelectorAll(R+' button,'+R+' h1,'+R+' h2,'+R+' h3,'+R+' p,'+R+' li,'+R+' .pb-name,'+R+' .rs-name,'+R+' .dne-text')].filter(vis);
 for(let i=0;i<els.length;i++)for(let j=i+1;j<els.length;j++){const a=els[i],b=els[j];if(a.contains(b)||b.contains(a))continue;if(a.closest('dialog')!==b.closest('dialog'))continue;if(a.closest('.lang-dropdown')||b.closest('.lang-dropdown')||clipped(a)||clipped(b))continue;const A=a.getBoundingClientRect(),B=b.getBoundingClientRect();const w=Math.min(A.right,B.right)-Math.max(A.left,B.left),h=Math.min(A.bottom,B.bottom)-Math.max(A.top,B.top);if(w>2&&h>2)ov.push((a.className||a.tagName)+' x '+(b.className||b.tagName))}
 const scr=[...document.querySelectorAll(R+' *')].filter(e=>{if(!vis(e)||e.matches('main,body,.app-main,.dlg,.dlg-overlay'))return false;const cs=getComputedStyle(e);return /(auto|scroll)/.test(cs.overflowY)&&e.scrollHeight>e.clientHeight+1&&e.tabIndex<0&&!e.querySelector('button,a[href],input,textarea,select,[tabindex]')}).map(e=>e.className);
 const lo=[];
 document.querySelectorAll(R+' *').forEach(e=>{if(!vis(e)||e.disabled||e.closest('[disabled],svg,.pb-avatar,.rs-avatar,[aria-hidden=true]'))return;const own=[...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim());if(!own)return;const cs=getComputedStyle(e);const fg=pc(cs.color);const bg=bgOf(e);const f=over({...fg,a:fg.a*parseFloat(cs.opacity||1)},bg);const L1=lum(f),L2=lum(bg),ratio=(Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05);const fs=parseFloat(cs.fontSize),big=fs>=24||(fs>=18.66&&+cs.fontWeight>=700);if(ratio<(big?3:4.5)-.02)lo.push((e.className||e.tagName)+' '+ratio.toFixed(2))});
 const ok=!(document.documentElement.scrollWidth>vw+1)&&!bad.length&&!small.length&&!ov.length&&!scr.length&&!lo.length;
 const a=document.getElementById('audit');a.style.background=ok?'#1b5e20':'#b71c1c';a.style.color='#fff';
 const msg=ok?`✓ ${vw}px: kein Overflow, keine Überlappung, Ziele ≥44px, Kontrast ≥4,5:1, Scroll-Bereiche fokussierbar`:`✗ ${vw}px: ${document.documentElement.scrollWidth>vw+1?'Scroll. ':''}${bad.slice(0,2).join(', ')}${small.length?' | <44px: '+small.slice(0,2).join(', '):''}${ov.length?' | Überlappung: '+ov.slice(0,2).join(', '):''}${scr.length?' | Scroll ohne tabindex: '+scr.slice(0,2).join(', '):''}${lo.length?' | Kontrast: '+lo.slice(0,3).join(', '):''}`;
 a.textContent=msg;parent.postMessage({oct:'audit',ok,msg},'*');
}
const merge=(a,b)=>{for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=merge(a[k]&&typeof a[k]==='object'?a[k]:{},b[k])}else a[k]=b[k]}return a};
Promise.all([fetch('../uploads/10-de-texts.json').then(r=>r.json()),fetch('i18n-stage5-additions.json').then(r=>r.json())]).then(([a,b])=>{TX=merge(a,b.de);render();requestAnimationFrame(()=>setTimeout(audit,450))}).catch(e=>{document.getElementById('root').textContent='Fehler: '+e});
</script></body></html>
