function langSel(open){const L=[['Deutsch','DE'],['English','EN'],['Français','FR'],['Español','ES'],['Italiano','IT'],['Nederlands','NL'],['Polski','PL'],['Português','PT'],['Svenska','SV'],['Čeština','CS']];
 return `<div class="lang-selector-wrapper"><button class="lang-selector" aria-label="${t('a11y.selectLanguage')}" aria-expanded="${open}" aria-haspopup="listbox" data-act="lang"><span class="fi lang-flag" aria-hidden="true"></span><span class="lang-code">DE</span></button>${open?`<ul class="lang-dropdown" role="listbox" aria-label="${t('a11y.selectLanguage')}">${L.map(([n,c],i)=>`<li role="option" aria-selected="${i==0}" class="lang-option${i==0?' lang-option--active':''}" tabindex="0"><span class="fi lang-option-flag" aria-hidden="true"></span><span class="lang-option-name">${n}</span><span class="lang-option-code">${c}</span><span class="lang-option-check" aria-hidden="true">${i==0?I('Check',18):''}</span></li>`).join('')}</ul>`:''}</div>`}

const dlg=(size,role,lb,ds,inner,oa='',pa='')=>`<dialog class="dlg dlg--${size}" role="${role}" aria-modal="true" aria-labelledby="${lb}"${ds?` aria-describedby="${ds}"`:''}><div class="dlg-overlay" role="presentation" ${oa}><div class="dlg-panel" ${pa}>${inner}</div></div></dialog>`;
function confirm(title,msg,ok,cancel,destr,ov){return dlg('sm','alertdialog','confirm-dialog-title','confirm-dialog-message',`<div class="dlg-head"><h2 id="confirm-dialog-title" class="dlg-title">${esc(title)}</h2></div><div class="dlg-body"><p id="confirm-dialog-message" class="dlg-text">${esc(msg)}</p></div><div class="dlg-actions">${cancel?`<button class="btn btn-secondary" data-testid="confirm-dialog-cancel">${cancel}</button>`:''}<button class="btn ${destr?'btn-danger':'btn-primary'}" data-testid="confirm-dialog-confirm">${ok}</button></div>`,'data-testid="confirm-dialog-overlay"')}
const toast=(type,msg,top)=>`<div class="toast toast-${type} toast-visible" data-test="toast-notification" role="${type==='error'||type==='warning'?'alert':'status'}"${top!=null?` style="top:calc(var(--header-h) + 8px + ${top}px)"`:''}><div class="toast-icon" aria-hidden="true">${I({success:'CircleCheck',error:'CircleX',warning:'Alert',info:'Info'}[type],22)}</div><div class="toast-content"><p class="toast-message" data-test="toast-message">${esc(msg)}</p></div><button class="toast-close" aria-label="${t('common.close')}" data-test="toast-close-button">${I('X',18)}</button></div>`;

function nameBlock(n,nm){const fs=n.length>26?17:n.length>18?20:24;

 const m=SRCMAP[d.src],label=SRCKEY[d.src]&&d.src!=='INTERNET_RADIO'?t('player.source.'+SRCKEY[d.src]):null;

const skelPreset=()=>`<div class="sk-preset"><div class="ui-skeleton" style="width:28px;height:28px;border-radius:50%"></div><div class="ui-skeleton" style="width:40px;height:40px;border-radius:8px"></div><div class="sk-content"><div class="ui-skeleton" style="width:80%;height:18px;border-radius:4px"></div></div></div>`;

let S={i:+P('i',0),lang:P('lang','closed')==='open'};
