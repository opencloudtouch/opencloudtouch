<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#0d0d0d}</style>
</helmet>
<div style="min-height:100vh;background:#0d0d0d;color:#e0e0e0;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column">
  <div style="max-height:44vh;overflow:auto;background:#141414;border-bottom:1px solid #333;padding:12px 16px;display:flex;flex-direction:column;gap:8px">
    <div style="font-weight:700;font-size:14px;color:#fff">OCT App · Stufe 13 · Preset-Zeile als Toggle mit eigenem Ändern-Button</div>
    <div style="font-size:12px;color:#b3b3b3;line-height:1.5">{{ hint }}</div>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="8">
      <div style="display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center"><span style="font-size:12px;color:#949494;margin-right:4px;min-width:70px">{{ g.label }}</span><sc-for list="{{ g.buttons }}" as="b" hint-placeholder-count="4"><button onClick="{{ b.on }}" style="{{ b.style }}">{{ b.label }}</button></sc-for></div>
    </sc-for>
  </div>
  <div style="flex:1;overflow:auto;padding:16px 16px 48px">
    <div style="display:flex;justify-content:center"><iframe key="{{ nonce }}" src="{{ src }}" title="Stufe 13" style="{{ frameStyle }}"></iframe></div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { page: 'rows', pv: '1', c: 'radiop', ps: '', zone: 'none', sw: 'idle', fail: '0', more: '0', last: '0', lang: 'de', fv: 'strip', long: '0', theme: 'dark', width: 390, height: 1100, start: 'online', nonce: 0 };
  renderVals() {
    const s = this.state;
    const pill = (on) => ({ minHeight: 32, padding: '6px 12px', lineHeight: '1.2', flexShrink: 0, whiteSpace: 'nowrap', borderRadius: 999, border: '1px solid ' + (on ? '#4a90d9' : '#3a3a3a'), background: on ? 'rgba(74,144,217,.2)' : 'transparent', color: on ? '#fff' : '#b3b3b3', fontSize: 13, fontWeight: 500, fontFamily: 'inherit', cursor: 'pointer' });
    const set = (o) => this.setState({ ...o, nonce: this.state.nonce + 1 });
    const grp = (label, key, opts) => ({ label, buttons: opts.map(([v, l]) => ({ label: l, style: pill(s[key] === v), on: () => set({ [key]: v }) })) });
    const rows = s.page === 'rows';
    const groups = [grp('Ansicht', 'page', [['rows', 'Preset-Zeile, Varianten'], ['card', 'Gerätekarte']])];
    if (!rows) {
      groups.push(
        grp('Variante', 'pv', [['1', 'V1 geteilt (Empfehlung)'], ['2', 'V2 rund'], ['3', 'V3 mit Wort']]),
        grp('Wiedergabe', 'c', [['radiop', 'Presets, Sender läuft'], ['radio', 'Presets, kein Sender'], ['bt', 'Bluetooth'], ['btnc', 'Bluetooth ohne Cover'], ['aux', 'AUX'], ['spotify', 'Spotify (nur Anzeige)'], ['standby', 'Standby']]),
        grp('Preset-Zustand', 'ps', [['', 'Läuft'], ['paused', 'Pausiert'], ['starting', 'Wird gestartet'], ['failed', 'Start fehlgeschlagen']]),
        grp('Klick auf Preset', 'fail', [['0', 'startet'], ['1', 'schlägt fehl']]),
        grp('Zuletzt gewählt', 'last', [['0', 'Preset 1'], ['2', 'Preset 3'], ['5', 'Preset 6']]),
        grp('Zone', 'zone', [['none', 'Keine'], ['master', 'Master'], ['member', 'Slave']]),
        grp('Start auf', 'start', [['online', 'Gerät online'], ['offline', 'Gerät offline']]),
        grp('Umschalten', 'sw', [['idle', 'Bereit'], ['switching', 'Wird umgeschaltet'], ['failed', 'Fehlgeschlagen']]),
        grp('Fehlerhinweis', 'fv', [['strip', 'A Streifen unter Leiste'], ['label', 'B ersetzt Textzeile'], ['toast', 'C Toast + Taste markiert']]),
        grp('Länge', 'long', [['0', 'Normal'], ['1', 'Sehr lang']])
      );
    }
    groups.push(grp('Texte', 'lang', [['de', 'Deutsch'], ['sv', 'Svenska']]), grp('Thema', 'theme', [['dark', 'Dunkel'], ['light', 'Hell']]));
    const sizes = [[320, 1100], [390, 1100], [768, 1100], [1280, 900]];
    groups.push({ label: 'Breite', buttons: sizes.map(([w, h]) => ({ label: String(w), style: pill(s.width === w), on: () => set({ width: w, height: h }) })) });
    const q = ['page=' + (rows ? 'rows' : 'devices'), 'v=after', 'pv=' + s.pv, 'c=' + s.c, 'ps=' + s.ps, 'zone=' + s.zone, 'sw=' + s.sw, 'swt=aux', 'fail=' + s.fail, 'more=' + s.more, 'last=' + s.last, 'lang=' + s.lang, 'long=' + s.long, 'fv=' + s.fv, 'theme=' + s.theme, 'dev=5', 'off=2', 'i=' + (s.start === 'offline' ? 2 : 0), 'name=' + (s.long === '1' ? 'long' : 'std')].join('&');
    return {
      groups, nonce: s.nonce,
      hint: rows ? 'Drei Varianten der Preset-Zeile in allen Zuständen: belegt, läuft, pausiert, wird gestartet, Start fehlgeschlagen, leer, deaktiviert, Fokus, gedrückt, lange Namen. Die Zeilen sind echte Bedienelemente (Tab, Enter, Leertaste).' : 'Gerätekarte aus Stufe 10 mit den drei Quellen-Tasten aus Stufe 12; Presets sind jetzt Toggle-Zeilen mit eigenem Ändern-Button. Tipp auf die Zeile: startet, pausiert oder setzt fort. „Sender suchen“ entfällt.',
      src: 'app13/stage13-frame.html?' + q,
      frameStyle: { display: 'block', width: s.width, maxWidth: '100%', height: s.height, border: '1px solid #333', background: s.theme === 'light' ? '#f1f3f6' : '#1a1a1a' }
    };
  }
}

</script>
</body>
</html>
